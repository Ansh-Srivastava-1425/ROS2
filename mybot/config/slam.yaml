slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames: the names of the coordinate frames SLAM works with
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # Input
    scan_topic: /scan

    # Behaviour
    mode: mapping
    resolution: 0.05
    max_laser_range: 3.5
    map_update_interval: 2.0